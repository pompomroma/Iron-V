name: Deploy to GitHub Pages

# Publishes the game to the `gh-pages` branch, which GitHub Pages serves
# automatically — no repo settings or Pages-admin API permissions needed.
# (This repo was created empty, so the game branch below is the default
# branch; "main" is kept for the future.)
on:
  push:
    branches:
      - main
      - claude/3d-web-boxing-game-joyjf2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish working tree to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # workflow tokens may not push workflow files, and the site
          # doesn't need them — publish everything else
          rm -rf .github
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA::7}"
          git push -f origin gh-pages
